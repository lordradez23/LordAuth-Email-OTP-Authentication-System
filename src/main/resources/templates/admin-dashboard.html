<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LordAuth — Admin Dashboard.">
    <title>LordAuth | Admin Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { align-items: flex-start; padding: 2rem 1rem; }
        .dashboard-nav { width: 100%; max-width: 820px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding: 0 0.25rem; }
        .nav-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 800; font-size: 1.1rem; background: linear-gradient(135deg, var(--primary-light), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .nav-brand span { font-size: 1.3rem; }
        .dashboard-container { max-width: 820px; width: 100%; }
        .table-container { background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 1.5rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; color: var(--text); }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .badge { padding: 0.3rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge.admin { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
        .badge.user { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
        .badge.locked { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .badge.active { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    </style>
</head>
<body>
    <nav class="dashboard-nav">
        <div class="nav-brand">
            <span>🛡️</span> LordAuth Admin
        </div>
        <a href="/home" style="color: var(--text-secondary); text-decoration: none;">Back to User Dashboard</a>
    </nav>
    <div class="dashboard-container">
        <div class="table-container">
            <h2 style="margin-top: 0; margin-bottom: 1rem; color: var(--text);">User Management</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Last Login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usersList}">
                        <td th:text="'#' + ${u.id}"></td>
                        <td th:text="${u.name}"></td>
                        <td th:text="${u.emailId}"></td>
                        <td>
                            <span th:class="'badge ' + (${u.role == 'ROLE_ADMIN'} ? 'admin' : 'user')" th:text="${u.role}"></span>
                        </td>
                        <td>
                            <span th:class="'badge ' + (${u.isLocked()} ? 'locked' : 'active')" th:text="${u.isLocked() ? 'LOCKED' : 'ACTIVE'}"></span>
                        </td>
                        <td th:text="${u.lastLoginAt != null ? #temporals.format(u.lastLoginAt, 'dd MMM yyyy, HH:mm') : 'Never'}"></td>
                        <td>
                            <form th:if="${!u.isLocked() && u.id != user.id}" action="/admin/lock" method="post" style="display:inline;">
                                <input type="hidden" name="userId" th:value="${u.id}"/>
                                <button type="submit" style="padding: 0.2rem 0.5rem; background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.5); border-radius: 4px; cursor: pointer; font-size: 0.75rem;">Lock</button>
                            </form>
                            <form th:if="${u.isLocked() && u.id != user.id}" action="/admin/unlock" method="post" style="display:inline;">
                                <input type="hidden" name="userId" th:value="${u.id}"/>
                                <button type="submit" style="padding: 0.2rem 0.5rem; background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.5); border-radius: 4px; cursor: pointer; font-size: 0.75rem;">Unlock</button>
                            </form>
                            <form th:if="${u.id != user.id}" action="/admin/force-reset" method="post" style="display:inline; margin-left: 4px;">
                                <input type="hidden" name="userId" th:value="${u.id}"/>
                                <button type="submit" style="padding: 0.2rem 0.5rem; background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.4); border-radius: 4px; cursor: pointer; font-size: 0.75rem;" th:title="${u.forcePasswordReset ? 'Reset already flagged' : 'Force password reset on next login'}">⚠️ Force Reset</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <h3 style="margin-top: 2rem; color: var(--text);">Global Audit Logs (Last 100)</h3>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Email ID</th>
                        <th>IP Address</th>
                        <th>Outcome</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${auditLogs}">
                        <td th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy, HH:mm')}"></td>
                        <td th:text="${log.email}"></td>
                        <td th:text="${log.ipAddress != null ? log.ipAddress : 'Unknown'}"></td>
                        <td>
                            <span th:if="${log.outcome.name() == 'SUCCESS'}" style="color: #34d399;">Success</span>
                            <span th:if="${log.outcome.name() == 'FAIL'}" style="color: #f87171;">Failed</span>
                            <span th:if="${log.outcome.name() == 'LOCKED'}" style="color: #fbbf24;">Locked Out</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
